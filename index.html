<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SRT Translator</title>
<style>
  :root {
    --bg: #141414;
    --panel: #1f1f1f;
    --panel-2: #181818;
    --border: #2e2e2e;
    --text: #ececec;
    --muted: #888;
    --accent: #4a9eff;
    --error: #ff5a5a;
    --success: #44dd88;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    font-size: 14px;
  }
  .container { max-width: 1500px; margin: 0 auto; padding: 16px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 14px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.3px;
  }
  .change-link {
    font-size: 12px; color: var(--muted); background: none; border: none;
    cursor: pointer; padding: 4px 10px; border-radius: 4px;
    font-family: inherit;
  }
  .change-link:hover { color: var(--text); background: var(--panel); }

  .layout {
    display: grid; grid-template-columns: 1fr 380px; gap: 18px;
  }
  .left { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  #player-wrap {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #000; border-radius: 8px; overflow: hidden;
  }
  #player { width: 100%; height: 100%; }

  .subtitle-overlay {
    position: absolute; bottom: 12%; left: 6%; right: 6%; text-align: center;
    color: #fff; font-size: clamp(15px, 2.6vw, 28px); font-weight: 600;
    line-height: 1.3; white-space: pre-line; pointer-events: none; z-index: 2;
    letter-spacing: 0.2px;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000,
      -2px 2px 0 #000, 2px 2px 0 #000,
      0 0 10px rgba(0,0,0,0.95);
  }

  .transport { display: flex; gap: 10px; align-items: stretch; }
  .play-btn-big {
    background: var(--accent); color: #fff; border: none;
    padding: 20px; border-radius: 8px; font-size: 20px; font-weight: 600;
    cursor: pointer; flex: 1; letter-spacing: 0.5px;
    transition: background 0.1s; font-family: inherit;
  }
  .play-btn-big:hover { background: #5aa8ff; }
  .scrub-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 600; padding: 0 24px; min-width: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; line-height: 1.1; transition: background 0.1s;
  }
  .scrub-btn:hover { background: #2a2a2a; }
  .scrub-btn .arrow { font-size: 20px; }
  .scrub-btn .lbl { font-size: 11px; color: var(--muted); }

  .editor {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mark {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .mark label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted);
  }
  .mark .time {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 16px;
  }
  .mark button {
    padding: 10px; font-size: 14px; font-weight: 500;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; cursor: pointer;
    font-family: inherit;
  }
  .mark button:hover { background: #2a2a2a; }

  .lines { display: flex; flex-direction: column; gap: 8px; }
  input[type="text"] {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 6px; outline: none; font-size: 15px;
    font-family: inherit;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  .actions { display: flex; gap: 10px; }
  .actions button {
    flex: 1; padding: 14px; font-size: 15px; font-weight: 500;
    border-radius: 6px; cursor: pointer; border: 1px solid var(--border);
    font-family: inherit;
  }
  .actions .clear-btn { background: var(--panel-2); color: var(--text); }
  .actions .clear-btn:hover { background: var(--panel); }
  .actions .save-btn { background: var(--accent); color: #fff; border-color: var(--accent); flex: 2; }
  .actions .save-btn:hover { background: #5aa8ff; }

  .sidebar {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
    max-height: calc(100vh - 60px);
  }
  .sidebar-head { display: flex; justify-content: space-between; align-items: center; }
  .sidebar-head strong { font-size: 14px; }
  .srt-btn {
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 12.5px;
    font-weight: 500; font-family: inherit;
  }
  .srt-btn:hover { background: #5aa8ff; }

  .captions-list {
    overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px;
  }
  .caption-row {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; cursor: pointer; transition: background 0.1s, border-color 0.1s;
  }
  .caption-row:hover { background: #222; }
  .caption-row.active { border-color: var(--accent); background: #1a2230; }
  .caption-row.editing { border-color: #ff9b3d; }
  .caption-times {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between; margin-bottom: 4px;
  }
  .caption-text { font-size: 13px; white-space: pre-line; }
  .caption-actions { display: flex; gap: 4px; margin-top: 6px; }
  .caption-actions button {
    font-size: 11px; padding: 3px 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  .caption-actions .del { color: var(--error); }
  .empty-state { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 12px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--error); color: var(--error); }
  .toast.success { border-color: var(--success); color: var(--success); }

  @media (max-width: 1024px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { max-height: 400px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>SRT Translator</h1>
    <button class="change-link" onclick="changeVideo()">Change video</button>
  </header>

  <div class="layout">
    <div class="left">
      <div id="player-wrap">
        <div id="player"></div>
        <div id="overlay" class="subtitle-overlay"></div>
      </div>

      <div class="transport">
        <button class="scrub-btn" onclick="seekRelative(-3)" title="Back 3 seconds">
          <span class="arrow">⏪</span><span class="lbl">−3s</span>
        </button>
        <button class="play-btn-big" id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button class="scrub-btn" onclick="seekRelative(3)" title="Forward 3 seconds">
          <span class="arrow">⏩</span><span class="lbl">+3s</span>
        </button>
      </div>

      <div class="editor">
        <div class="marks">
          <div class="mark">
            <label>Start time</label>
            <div class="time" id="startDisplay">— — : — — : — —</div>
            <button onclick="markStart()">Mark Start</button>
          </div>
          <div class="mark">
            <label>End time</label>
            <div class="time" id="endDisplay">— — : — — : — —</div>
            <button onclick="markEnd()">Mark End</button>
          </div>
        </div>

        <div class="lines">
          <input type="text" id="line1" placeholder="Line 1" autocomplete="off" />
          <input type="text" id="line2" placeholder="Line 2" autocomplete="off" maxlength="42" />
        </div>

        <div class="actions">
          <button class="clear-btn" onclick="clearCurrent()">Clear</button>
          <button class="save-btn" onclick="saveCaption()">Save Caption</button>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-head">
        <strong>Captions <span id="count" style="color:var(--muted);font-weight:400">(0)</span></strong>
        <button class="srt-btn" onclick="exportSRT()">⬇ Download .srt</button>
      </div>
      <div class="captions-list" id="captionsList">
        <div class="empty-state">No captions yet.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let player = null;
let playerReady = false;
let captions = [];
let currentStart = null;
let currentEnd = null;
let currentVideoId = 'oNhE89V2S6o';
let editingIdx = null;
const MAX_LINE = 42;

// Persistence
function storageKey(id) { return 'srt-captions-' + id; }
function loadCaptionsForVideo(id) {
  try { captions = JSON.parse(localStorage.getItem(storageKey(id))) || []; }
  catch (e) { captions = []; }
}
function persist() {
  try { localStorage.setItem(storageKey(currentVideoId), JSON.stringify(captions)); } catch (e) {}
}

const lastVideoId = localStorage.getItem('srt-last-video');
if (lastVideoId) currentVideoId = lastVideoId;
loadCaptionsForVideo(currentVideoId);

// YouTube API
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.body.appendChild(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: currentVideoId,
    width: '100%', height: '100%',
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { playerReady = true; startTimeLoop(); },
      onStateChange: (e) => {
        const btn = document.getElementById('playBtn');
        btn.textContent = (e.data === YT.PlayerState.PLAYING) ? '⏸ Pause' : '▶ Play';
      }
    }
  });
}

function changeVideo() {
  const current = 'https://youtu.be/' + currentVideoId;
  const url = prompt('Paste YouTube URL:', current);
  if (!url) return;
  const id = extractVideoId(url);
  if (!id) { toast('Invalid YouTube URL', 'error'); return; }
  if (id === currentVideoId) return;
  persist();
  currentVideoId = id;
  localStorage.setItem('srt-last-video', id);
  loadCaptionsForVideo(id);
  if (playerReady) player.loadVideoById({ videoId: id });
  renderCaptions();
  clearCurrent();
}

function extractVideoId(url) {
  if (!url) return null;
  url = url.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/); if (m) return m[1];
  m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/); if (m) return m[1];
  m = url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/); if (m) return m[1];
  m = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/); if (m) return m[1];
  return null;
}

function formatTime(seconds, srt = false) {
  if (seconds == null || isNaN(seconds)) return '— — : — — : — —';
  if (seconds < 0) seconds = 0;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.floor((seconds - Math.floor(seconds)) * 1000);
  const sep = srt ? ',' : '.';
  return `${pad(h,2)}:${pad(m,2)}:${pad(s,2)}${sep}${pad(ms,3)}`;
}
function pad(n, len) { return String(n).padStart(len, '0'); }

function getCurrentTime() {
  if (!playerReady) return 0;
  try { return player.getCurrentTime() || 0; } catch (e) { return 0; }
}

function startTimeLoop() {
  setInterval(() => {
    if (!playerReady) return;
    const t = getCurrentTime();
    updateOverlay(t);
    updateActiveCaption(t);
  }, 80);
}

function updateOverlay(t) {
  const active = captions.find(c => t >= c.start && t <= c.end);
  document.getElementById('overlay').textContent =
    active ? [active.line1, active.line2].filter(Boolean).join('\n') : '';
}

function updateActiveCaption(t) {
  document.querySelectorAll('.caption-row').forEach(row => {
    const idx = parseInt(row.dataset.idx);
    const c = captions[idx];
    if (c && t >= c.start && t <= c.end) row.classList.add('active');
    else row.classList.remove('active');
  });
}

function togglePlay() {
  if (!playerReady) return;
  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}

function seekRelative(delta) {
  if (!playerReady) return;
  player.seekTo(Math.max(0, getCurrentTime() + delta), true);
}

function markStart() {
  currentStart = getCurrentTime();
  document.getElementById('startDisplay').textContent = formatTime(currentStart);
}
function markEnd() {
  currentEnd = getCurrentTime();
  document.getElementById('endDisplay').textContent = formatTime(currentEnd);
}

function clearCurrent() {
  currentStart = null; currentEnd = null; editingIdx = null;
  document.getElementById('startDisplay').textContent = '— — : — — : — —';
  document.getElementById('endDisplay').textContent = '— — : — — : — —';
  document.getElementById('line1').value = '';
  document.getElementById('line2').value = '';
  document.querySelector('.save-btn').textContent = 'Save Caption';
  renderCaptions();
}

function saveCaption() {
  if (currentStart == null || currentEnd == null) { toast('Mark both Start and End first', 'error'); return; }
  if (currentEnd <= currentStart) { toast('End must be after Start', 'error'); return; }
  const line1 = document.getElementById('line1').value.trim();
  const line2 = document.getElementById('line2').value.trim();
  if (!line1 && !line2) { toast('Type at least one line', 'error'); return; }

  const wasEditing = editingIdx !== null;
  const cap = { start: currentStart, end: currentEnd, line1, line2 };
  if (wasEditing) captions[editingIdx] = cap;
  else captions.push(cap);
  captions.sort((a, b) => a.start - b.start);
  persist();
  clearCurrent();

  // Auto-continue: pre-fill next caption's start with the just-saved end time
  if (!wasEditing) {
    currentStart = cap.end;
    document.getElementById('startDisplay').textContent = formatTime(cap.end);
  }

  renderCaptions();
  document.getElementById('line1').focus();
  toast('Saved', 'success');
}

function renderCaptions() {
  const list = document.getElementById('captionsList');
  document.getElementById('count').textContent = '(' + captions.length + ')';
  if (captions.length === 0) {
    list.innerHTML = '<div class="empty-state">No captions yet.</div>';
    return;
  }
  list.innerHTML = captions.map((c, i) => {
    const editingCls = (i === editingIdx) ? ' editing' : '';
    return `
    <div class="caption-row${editingCls}" data-idx="${i}" onclick="seekToCaption(${i})">
      <div class="caption-times">
        <span>${formatTime(c.start)} → ${formatTime(c.end)}</span>
        <span>#${i+1}</span>
      </div>
      <div class="caption-text">${escapeHtml([c.line1, c.line2].filter(Boolean).join('\n'))}</div>
      <div class="caption-actions" onclick="event.stopPropagation()">
        <button onclick="editCaption(${i})">Edit</button>
        <button onclick="deleteCaption(${i})" class="del">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function seekToCaption(idx) {
  const c = captions[idx]; if (!c || !playerReady) return;
  player.seekTo(c.start, true);
}

function editCaption(idx) {
  const c = captions[idx]; if (!c) return;
  currentStart = c.start; currentEnd = c.end; editingIdx = idx;
  document.getElementById('startDisplay').textContent = formatTime(c.start);
  document.getElementById('endDisplay').textContent = formatTime(c.end);
  document.getElementById('line1').value = c.line1 || '';
  document.getElementById('line2').value = c.line2 || '';
  document.querySelector('.save-btn').textContent = 'Update';
  renderCaptions();
  document.getElementById('line1').focus();
}

function deleteCaption(idx) {
  if (!confirm('Delete this caption?')) return;
  captions.splice(idx, 1);
  if (editingIdx === idx) clearCurrent();
  else if (editingIdx !== null && editingIdx > idx) editingIdx--;
  persist();
  renderCaptions();
}

function exportSRT() {
  if (captions.length === 0) { toast('Nothing to export', 'error'); return; }
  const sorted = [...captions].sort((a, b) => a.start - b.start);
  const srt = sorted.map((c, i) => {
    const lines = [c.line1, c.line2].filter(Boolean).join('\n');
    return `${i+1}\n${formatTime(c.start, true)} --> ${formatTime(c.end, true)}\n${lines}\n`;
  }).join('\n');
  const blob = new Blob([srt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `subtitles-${currentVideoId}.srt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Line 1 overflow → line 2 (word-aware, cursor follows when typing at end)
function handleLine1Input() {
  const line1 = document.getElementById('line1');
  const line2 = document.getElementById('line2');
  if (line1.value.length <= MAX_LINE) return;

  const cursorPos = line1.selectionStart;
  let breakAt = -1;
  const scanEnd = Math.min(MAX_LINE, line1.value.length - 1);
  for (let i = scanEnd; i >= 0; i--) {
    if (line1.value[i] === ' ') { breakAt = i; break; }
  }
  if (breakAt <= 0) breakAt = MAX_LINE;

  const keep = line1.value.substring(0, breakAt).replace(/\s+$/, '');
  const overflow = line1.value.substring(breakAt).replace(/^\s+/, '');
  line1.value = keep;
  const merged = overflow + (line2.value ? ' ' + line2.value : '');
  line2.value = merged.substring(0, MAX_LINE);

  if (cursorPos > breakAt) {
    line2.focus();
    const newPos = Math.min(overflow.length, line2.value.length);
    try { line2.setSelectionRange(newPos, newPos); } catch (e) {}
  } else {
    const newPos = Math.min(cursorPos, line1.value.length);
    try { line1.setSelectionRange(newPos, newPos); } catch (e) {}
  }
}
document.getElementById('line1').addEventListener('input', handleLine1Input);

// Keyboard shortcuts (kept invisible — Space play/pause, S/E mark, Enter save)
document.addEventListener('keydown', (e) => {
  const isTyping = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  const mod = e.metaKey || e.ctrlKey;

  if (mod) {
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); markStart(); return; }
    if (e.key === 'e' || e.key === 'E') { e.preventDefault(); markEnd(); return; }
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
    if (e.key === 'Enter') { e.preventDefault(); saveCaption(); return; }
  }

  if (isTyping) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (document.activeElement.id === 'line1') document.getElementById('line2').focus();
      else if (document.activeElement.id === 'line2') saveCaption();
    }
    return;
  }

  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); markStart(); }
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); markEnd(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekRelative(-3); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekRelative(3); }
});

// Toast
let toastTimer = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

renderCaptions();
</script>
</body>
</html>
