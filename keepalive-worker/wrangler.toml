name = "subcaptions-keepalive"
main = "keepalive.js"
compatibility_date = "2026-01-01"

# Once a day at 12:00 UTC. Supabase pauses after 7 days of low DB activity, so daily
# leaves a very wide safety margin even if a run or two is missed.
[triggers]
crons = ["0 12 * * *"]

